agents:
  queue: "shaoting-gcp"
steps:
  - label: "Setup"
    key: "setup"
    commands:
      - bash .buildkite/correctness/env-setup.sh # this will generate a .buildkite/correctness/correctness_venv that every step should use
  - label: "Run E2E Correctness Test on a dense model"
    key: "dense-model-test"
    commands:
      - bash .buildkite/correctness/e2e.sh meta-llama/Llama-3.1-8B
  - label: "Run E2E Correctness Test on an MLA model"
    key: "mla-model-test"
    commands:
      - bash .buildkite/correctness/e2e.sh deepseek-ai/DeepSeek-V2-Lite
  - label: "Upload all pngs as artifacts"
    key: "upload-artifacts"
    commands:
      - buildkite-agent artifact upload ".buildkite/correctness/results-*.png"
    depends_on:
      - "dense-model-test"
      - "mla-model-test"